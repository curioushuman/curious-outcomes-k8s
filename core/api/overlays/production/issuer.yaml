apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-co
  # Namespace will be added by ArgoCD
  # namespace: argocd
spec:
  acme:
    email: "admin@partner.example"
    server: "https://acme-v02.api.letsencrypt.org/directory"
    privateKeySecretRef:
      name: letsencrypt-co-secret
    solvers:
      # Use the HTTP-01 challenge provider
      - http01:
          ingress:
            class: nginx
